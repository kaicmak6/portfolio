name: Build and Push Portfolio Image to GHCR

on:
  push:
    branches:
      - main  # Triggers the workflow on push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required to push images to GitHub Container Registry

    steps:
      # 1. Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx for enhanced build capabilities and caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to GitHub Container Registry (GHCR) using built-in GITHUB_TOKEN
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build the image and push to GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tags the image with 'latest' and the unique git commit SHA
          # Note: Lowercase conversion might be needed if your username has uppercase letters
          tags: |
            ghcr.io/${{ github.actor }}/portfolio:latest
            ghcr.io/${{ github.actor }}/portfolio:${{ github.sha }}
          # Utilizes GitHub Actions cache to speed up subsequent builds
          build-args: |
            DIRECTUS_HOST=${{ secrets.DIRECTUS_HOST }}
            BASE_PATH=${{ vars.BASE_PATH }}
            NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL }}
            IMAGE_DOMAINS=${{ vars.IMAGE_DOMAINS }}
            NEXT_PUBLIC_CLOUDFLARE_SITE_KEY=${{ secrets.NEXT_PUBLIC_CLOUDFLARE_SITE_KEY }}
            NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
